<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <title>Twilio 수신 테스트</title>
    <script src="https://sdk.twilio.com/js/client/v1.13/twilio.min.js"></script>
    <style>
        .log-line {
            font-family: 'Arial', sans-serif;
            font-size: 14px;
            margin-bottom: 8px;
            padding: 4px;
            border-bottom: 1px solid #eee;
        }
        #log-area {
            height: 300px;
            overflow-y: scroll;
            border: 1px solid #ccc;
            padding: 10px;
            margin-top: 20px;
        }
        #session-info {
            margin: 10px 0;
            font-weight: bold;
            color: #333;
        }
        .final-summary {
            margin-top: 10px;
            padding: 10px;
            border-top: 2px solid #aaa;
            background: #f5f5f5;
            white-space: pre-line;
        }
        .tab-bar {
            display: flex;
            background-color: #f0f0f0;
            border-radius: 8px;
            padding: 4px;
            margin-top: 20px;
            margin-bottom: 10px;
            width: 300px;
        }
        .tab-button {
            flex: 1;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            border-radius: 6px;
            transition: background-color 0.3s, color 0.3s;
            font-weight: bold;
            color: #555;
        }
        .tab-button.active {
            background-color: #007bff;
            color: white;
        }
        #summary-content {
            border: 1px solid #ccc;
            padding: 15px;
            background-color: #fff;
            min-height: 100px;
        }
    </style>
</head>
<body>
<h2>📞 브라우저 전화 수신 대기 중...</h2>
<button id="update-session-btn" style="display:none;">세션 userId 변경</button>
<button id="accept-btn" style="display:none;">📞 전화 수락</button>

<div id="session-info">🔒 세션 정보 수신 대기 중...</div>

<h3>📝 실시간 STT 로그</h3>
<div id="log-area"></div>


<h3>📜 최종 전체 텍스트</h3>
<div id="final-inbound"></div>
<div id="final-outbound"></div>

<h3>📝 상담 요약</h3>
<div id="summary-section">
    <div class="tab-bar">
        <div id="tab-v1" class="tab-button active">v1 요약</div>
        <div id="tab-v2" class="tab-button">v2 요약</div>
    </div>
    <div id="summary-content">요약 내용이 여기에 표시됩니다.</div>
</div>

<script>
    let pendingConnection = null;
    // const ws = new WebSocket("wss://pet-pipefish-friendly.ngrok-free.app/ws/stt?userId=1");
    let ws = null;
    let currentUserId = null;

    const sessionInfoDiv = document.getElementById("session-info");
    const logArea = document.getElementById("log-area");
    const finalInboundDiv = document.getElementById("final-inbound");
    const finalOutboundDiv = document.getElementById("final-outbound");
    const summarySection = document.getElementById("summary-section");
    const summaryContentDiv = document.getElementById("summary-content");
    const tabV1 = document.getElementById("tab-v1");
    const tabV2 = document.getElementById("tab-v2");

    const lines = {}; // track + index 키 기반 저장
    const trackState = {
        INBOUND: { currentIndex: 0, finalReceived: false },
        OUTBOUND: { currentIndex: 0, finalReceived: false }
    };

    function parseQueryParams(queryString) {
        const params = {};
        if (!queryString) {
            return params;
        }
        queryString.split('&').forEach(pair => {
            const [key, value] = pair.split('=');
            if (key && value) {
                params[decodeURIComponent(key)] = decodeURIComponent(value);
            }
        });
        return params;
    }

    function setupWebSocketListeners(websocket) {
        websocket.onopen = () => {
            console.log("🌐 WebSocket 연결 성공, 통화 수락 진행");
            if (pendingConnection) {
                pendingConnection.accept();
                console.log("✅ 통화 수락 완료");
                pendingConnection = null;
                document.getElementById("accept-btn").style.display = "none";
            }
        };
        websocket.onmessage = (event) => {
            try {
                const data = JSON.parse(event.data);

                console.log("=== data 출력 ===");
                console.log("Received WebSocket data:", data);

                if (data.type === "sessionInfo") {
                    sessionInfoDiv.innerText = `🔑 세션 코드: ${data.sessionCode} | 생성 시각: ${data.createdAt} | 폭언 횟수: ${data.totalAbuseCnt}`;
                } else if (data.type === "totalAbuseCntUpdate") {
                    sessionInfoDiv.innerText = sessionInfoDiv.innerText.replace(/폭언 횟수: .+/, `폭언 횟수: ${data.totalAbuseCnt}`);
                    console.log(`💡 폭언 횟수 업데이트됨: ${data.totalAbuseCnt} (세션 ID: ${data.callSessionId})`);
                } else if (data.type === "finalTranscript") {
                    const isInbound = data.track === "INBOUND";
                    const targetDiv = isInbound ? finalInboundDiv : finalOutboundDiv;
                    const label = isInbound ? "👤 고객 전체 텍스트" : "💼 상담원 전체 텍스트";

                    const summaryHTML = `
                    <div class="final-summary">
                        <strong>${label}</strong><br>
                        ${data.text}
                    </div>
                `;
                    targetDiv.innerHTML = summaryHTML;
                } else if (data.type === "stt") {
                    const sttLogData = data.payload;

                    const track = sttLogData.track;
                    const script = sttLogData.script || data.text;
                    const isFinal = sttLogData.isFinal;
                    const abuseLabel = isFinal ? (sttLogData.isAbuse ? `🚫 ${sttLogData.abuseType}` : "✅ 정상") : "🟡 중간";

                    const label = track === "INBOUND" ? "👤 고객" : "💼 상담원";
                    const finalLabel = isFinal ? "🟢 최종" : "🟡 중간";

                    const html = `<div class="log-line">${label} | ${finalLabel} | ${abuseLabel}<br>🗣️ ${script}</div>`;

                    const state = trackState[track];
                    const key = `${track}-${state.currentIndex}`;

                    lines[key] = html;

                    if (isFinal) {
                        state.finalReceived = true;
                        state.currentIndex++;
                    }

                    logArea.innerHTML = Object.values(lines).join("");
                    logArea.scrollTop = logArea.scrollHeight;
                } else {

                    console.warn("Unknown WebSocket message type received:", data.type, data);
                }

            } catch (e) {
                console.error("⚠️ WebSocket 메시지 처리 오류:", e);
            }
        };
        websocket.onerror = err => console.error("❌ WebSocket 오류:", err);
        websocket.onclose = () => console.log("🔌 WebSocket 연결 종료");
    }

    function showSummary(version) {
        tabV1.classList.remove('active');
        tabV2.classList.remove('active');

        if (version === 'v1') {
            tabV1.classList.add('active');
            summaryContentDiv.innerText = "v1 요약이 없습니다."; // 추후 api 결과값으로 대체
        } else if (version === 'v2') {
            tabV2.classList.add('active');
            summaryContentDiv.innerText = "v2 요약이 없습니다."; // 추후 api 결과값으로 대체
        }
    }

    const jwtToken = localStorage.getItem('jwtToken'); // 브라우저 로컬 스토리지에 jwtToken : <token> 이 저장되어 있어야 함
    if (!jwtToken) {
        console.error("🚨 JWT 토큰이 localStorage에 없습니다. 로그인 후 다시 시도해주세요.");
        sessionInfoDiv.innerText = "🚨 로그인 필요: JWT 토큰 없음";
        // 토큰이 없으면 Twilio Device 초기화 시도를 하지 않습니다.
    } else {
        fetch('/api/token', {
            method: 'GET',
            headers: {
                'Authorization': `Bearer ${jwtToken}`,
                'Content-Type': 'application/json',
                'Accept': 'application/json'
            }
        })
            .then(res => {
                if (!res.ok) {
                    console.error(`🚨 Twilio 토큰 요청 실패: ${res.status} ${res.statusText}`);
                    sessionInfoDiv.innerText = `🚨 인증 실패: ${res.status} ${res.statusText}`;
                    throw new Error('Failed to get Twilio token');
                }
                return res.json();
            })
            .then(data => {
                const accessToken = data.result.twilioAccessToken;
                currentUserId = data.result.userId;

                if (!currentUserId) {
                    console.error("🚨 서버로부터 userId를 받지 못했습니다. WebSocket 연결 불가.");
                    sessionInfoDiv.innerText = "🚨 서버 오류: 사용자 ID 없음";
                    return;
                }
                const device = new Twilio.Device(accessToken, { debug: true });

                device.on('ready', () => {
                    console.log('✅ Device ready');
                    // Twilio.Device.audio.speakerDevices.set('default');
                    console.log('Twilio.Device.audio on ready:', Twilio.Device.audio);

                    // console.log(`🔍 Device ready. WebSocket 연결 시작: userId=${userId}`);
                    // ws = new WebSocket(`wss://pet-pipefish-friendly.ngrok-free.app/ws/stt?userId=${userId}`);
                    // setupWebSocketListeners(ws);


                });

                device.on('incoming', conn => {
                    console.log('📞 수신:', conn.parameters.From);
                    pendingConnection = conn;
                    document.getElementById("accept-btn").style.display = "inline";
                    document.getElementById("update-session-btn").style.display = "inline";
                    // incoming 통화가 수락되기 전에 취소되었을 때 처리 필요
                });

                // Twilio Device 초기화 이후 세션 useId 변경을 위한 이벤트 리스너
                document.getElementById("update-session-btn").addEventListener("click", () => {
                    if (!pendingConnection) {
                        alert("수신 전화가 없습니다.");
                        return;
                    }

                    const parsedParams = parseQueryParams(pendingConnection.parameters.Params);
                    const initialCallSid = parsedParams.initialCallSid;
                    const clientDialCallSid = pendingConnection.parameters.CallSid;
                    const callerNumber = pendingConnection.parameters.From;

                    fetch('/api/sessions/call/accept', {
                        method: 'PATCH',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${jwtToken}`
                        },
                        body: JSON.stringify({
                            toClientCallSid: clientDialCallSid,
                            originalInboundCallSid: initialCallSid,
                            callerNumber: callerNumber
                        })
                    })
                        .then(res => res.json())
                        .then(apiResponse => {
                            console.log("✅ 세션 생성 응답:", apiResponse);
                            if (apiResponse.isSuccess && apiResponse.result) {
                                const sessionInfo = apiResponse.result;

                                // ✅ 세션 정보 UI 업데이트
                                sessionInfoDiv.innerText = `🔑 세션 코드: ${sessionInfo.callSessionCode} | 생성 시각: ${sessionInfo.createdAt} | 폭언 횟수: ${sessionInfo.totalAbuseCnt}`;
                            } else {
                                console.error("🚨 세션 생성 실패:", apiResponse.message || apiResponse);
                                alert("세션 생성에 실패했습니다.");
                            }
                        })
                        .catch(err => console.error("🚨 세션 생성 오류:", err));
                });

                document.getElementById("accept-btn").addEventListener("click", () => {
                    if (!pendingConnection) {
                        alert("통화 수락 대기 중인 연결이 없습니다.");
                        return;
                    }

                    // 통화 수락 클릭 시에만 웹소켓 연결을 시작하고, 이미 연결되어 있으면 새로 연결하지 않음
                    if (!ws || ws.readyState === WebSocket.CLOSED) {
                        ws = new WebSocket(`wss://callprotect.site/ws/stt?userId=${currentUserId}`);

                        // 웹소켓 연결 리스너 설정
                        setupWebSocketListeners(ws);
                    } else {
                        // 이미 웹소켓 연결된 상태면 바로 통화 수락
                        if (pendingConnection) {
                            pendingConnection.accept();
                            console.log("✅ 통화 수락 완료 (웹소켓 이미 연결됨)");
                            pendingConnection = null;
                            document.getElementById("accept-btn").style.display = "none";
                        }
                    }
                });

                //         if (Twilio.Device.audio && Twilio.Device.audio.speakerDevices && Twilio.Device.audio.speakerDevices.isSupported) {

                //                 console.error('🚨 Error setting speaker devices:', audioError);
                //                 alert('스피커 설정을 할 수 없습니다. 브라우저 설정을 확인해주세요.');
                //             }
                //         } else {
                //             console.warn('⚠️ Twilio.Device.audio 또는 speakerDevices가 준비되지 않았거나 지원되지 않습니다.');
                //         }
                //
                //         // api 추가
                //         console.log("Full Connection Object:", pendingConnection);
                //         console.log("Connection Parameters:", pendingConnection.parameters);
                //
                //         // 고객 -> twilio sid (최초 인바운드)
                //         const parsedParams = parseQueryParams(pendingConnection.parameters.Params);
                //         const initialCallSid = parsedParams.initialCallSid;
                //         console.log("Original Inbound CallSid (최초 고객 통화 SID): ", initialCallSid);
                //
                //         // twilio -> 브라우저 sid (아웃바운드) - 통화 수락 전에 현재 CallSid을 서버로 전달
                //         const clientDialCallSid = pendingConnection.parameters.CallSid;
                //         console.log("clientDialCallSid: ", clientDialCallSid);
                //
                //         // 고객 번호
                //         const callerNumber = pendingConnection.parameters.From;
                //         console.log("callerNumber: ", callerNumber);
                //
                //
                //         if (clientDialCallSid && initialCallSid && userId) {
                //             fetch('/api/sessions/call/accept', {
                //                 method: 'POST',
                //                 headers: {
                //                     'Content-Type': 'application/json',
                //                     'Authorization': `Bearer ${jwtToken}`
                //                 },
                //                 body: JSON.stringify({
                //                     toClientCallSid: clientDialCallSid, // 트윌리오 -> 브라우저 Outgoing Leg의 SID
                //                     originalInboundCallSid: initialCallSid, // 최초 고객 Incoming Leg의 SID
                //                     callerNumber: callerNumber
                //                 })
                //             })
                //                 .then(response => {
                //                     if (!response.ok) {
                //                         console.error('🚨 Failed to register accepted call with server:', response.status, response.statusText);
                //                         // 에러 처리: 서버에 등록 실패 시 사용자에게 알리거나 재시도
                //                     } else {
                //                         return response.json();
                //                     }
                //                 })
                //                 .then(apiResponse => {
                //                     if (apiResponse.isSuccess) {
                //                         const sessionInfo = apiResponse.result; // CallSessionInfoDTO 객체
                //                         if (sessionInfo) { // sessionInfo 객체가 null이 아닌지 확인

                //
                //                             // 🚨🚨🚨 여기에서 HTTP 응답으로 받은 세션 정보를 UI에 업데이트합니다. 🚨🚨🚨
                //                             sessionInfoDiv.innerText = `🔑 세션 코드: ${sessionInfo.callSessionCode} | 생성 시각: ${sessionInfo.createdAt} | 폭언 횟수: ${sessionInfo.totalAbuseCnt}`;
                //
                //                             // ✅ 1000ms 지연 후 accept
                //                             setTimeout(() => {

                //                             }, 1000);
                //
                //                             // 콘솔 로그 변수명 수정 및 위치 조정
                //                             console.log('✅ Call accepted registered with CallManager. ClientDialCallSid:', clientDialCallSid, 'UserId:', userIdToSend);
                //
                //                         } else {
                //                             console.error('🚨 Call accept API returned success but missing session info in result:', apiResponse);
                //                             alert('통화 수락 성공, 그러나 세션 정보가 누락되었습니다.');
                //                         }
                //                     } else {
                //                         console.error('🚨 Call accept API returned failure:', apiResponse.message);
                //                         alert(`통화 수락 실패: ${apiResponse.message || '알 수 없는 API 오류'}`);

                    console.log('❌ 통화 종료');
                    document.getElementById("accept-btn").style.display = "none";
                });

                device.on('error', err => {
                    console.error('🚨 Twilio 오류:', err);
                    document.getElementById("accept-btn").style.display = "none";
                });
            });
    }

    document.addEventListener("DOMContentLoaded", () => {
        tabV1.addEventListener('click', () => {
            showSummary('v1');
            // 여기에 v1 요약 API 호출 로직 추가

        tabV2.addEventListener('click', () => {
            showSummary('v2');
            // 여기에 v2 요약 API 호출 로직 추가

    });



</script>
</body>
</html>

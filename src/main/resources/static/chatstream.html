<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <title>SSE Chat Stream</title>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.8; }
        #typing-indicator {
            font-weight: bold;
            display: none;
            margin-top: 10px;
        }
    </style>
</head>
<body>
<h2>악성 민원 대응 챗봇</h2>

<input type="text" id="questionInput" placeholder="질문을 입력하세요" style="width: 400px; padding: 5px;">
<button id="start">질문하기</button>

<div id="response" style="margin-top:20px; white-space:pre-wrap; font-family:Arial; line-height:1.8;"></div>
<div id="typing-indicator">GPT is typing<span id="dots"></span></div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        let currentSessionId = null;

        document.getElementById("start").addEventListener("click", async () => {
            const question = document.getElementById("questionInput").value.trim();
            const responseDiv = document.getElementById("response");
            const typingIndicator = document.getElementById("typing-indicator");
            const dotsSpan = document.getElementById("dots");

            responseDiv.innerHTML = "";
            typingIndicator.style.display = "none";
            dotsSpan.textContent = "";

            if (!question) {
                alert("질문을 입력해주세요!");
                return;
            }

            const token = localStorage.getItem("accessToken");
            if (!token) {
                alert("JWT 토큰이 없습니다. 먼저 localStorage에 accessToken을 저장하세요.");
                return;
            }

            if (!currentSessionId) {
                const sessionRes = await fetch("/api/chat-session", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": "Bearer " + token
                    }
                });

                if (!sessionRes.ok) {
                    alert("세션 생성 실패: " + sessionRes.status);
                    return;
                }

                const sessionData = await sessionRes.json();
                currentSessionId = sessionData.result.sessionId;
                console.log("세션 생성 완료:", currentSessionId);
            }

            const encodedQuestion = encodeURIComponent(question);
            const eventSource = new EventSource(`/api/chat/stream?sessionId=${currentSessionId}&question=${encodedQuestion}`);

            typingIndicator.style.display = "block";
            let dotCount = 0;
            const dotInterval = setInterval(() => {
                dotCount = (dotCount + 1) % 4;
                dotsSpan.textContent = ".".repeat(dotCount);
            }, 500);

            let buffer = "";
            eventSource.onmessage = (event) => {
                const chunk = event.data;

                if (chunk === "[END]") {
                    try {
                        const jsonStart = buffer.indexOf("{");
                        const jsonEnd = buffer.lastIndexOf("}") + 1;
                        const jsonString = buffer.substring(jsonStart, jsonEnd);
                        const parsed = JSON.parse(jsonString);

                        responseDiv.innerHTML = `
                            <p><strong>💬 답변:</strong><br>${parsed.answer}</p>
                            <p><strong>📚 출처:</strong></p>
                            <ul  style="margin-top:5px; margin-bottom:5px;">
                                ${parsed.sourcePages.map(sp => `
                                    <li>📌 유형: ${sp["유형"]}<br>
                                    ⚖ 관련 법률: ${sp["관련 법률"] || sp["관련법률"] || "없음"}</li>
                                `).join("")}
                            </ul>
                        `;
                    } catch (e) {
                        console.error("JSON 파싱 오류:", e);
                        responseDiv.innerHTML = "⚠️ 응답 파싱 중 오류 발생";
                    }

                    typingIndicator.style.display = "none";
                    clearInterval(dotInterval);
                    eventSource.close();
                    return;
                }

                buffer += chunk;
            };

            eventSource.onerror = () => {
                console.log("⛔ SSE 연결 종료");
                typingIndicator.style.display = "none";
                clearInterval(dotInterval);
                eventSource.close();
            };
        });
    });
</script>

</body>
</html>
